[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemotron-data-forge"
version = "0.1.0"
description = "Turn any topic into a graded, de-duplicated, fine-tuning-ready dataset using NVIDIA Nemotron on Nebius Token Factory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mahesh", email = "mxhesh.dev@gmail.com" }]
keywords = ["nemotron", "nebius", "token-factory", "dataset", "fine-tuning", "tavily", "nvidia"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai>=1.30.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.23.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
dataforge = "nemotron_data_forge.cli:main"

[tool.setuptools]
packages = ["nemotron_data_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]
